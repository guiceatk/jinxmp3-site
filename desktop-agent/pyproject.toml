[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent"
version = "0.1.0"
description = "Local-first autonomous desktop agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "pystray>=0.19; sys_platform=='win32'",
    "pillow>=10.0",
    "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]
ui = [
    "PyQt6>=6.6",
]

[project.scripts]
desktop-agent = "agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
