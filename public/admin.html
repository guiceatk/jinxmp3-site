<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel · JINXMP3</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1.5rem;
    }
    .product-form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .form-group label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input, .form-group textarea {
      padding: 0.6rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .form-group textarea {
      min-height: 3rem;
      resize: vertical;
    }
    .btn-danger {
      border-color: #f08080;
      color: #f08080;
      background: transparent;
      border: 1px solid #f08080;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
    }
    .toast {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }
    .toast.success {
      background: rgba(61,154,106,0.15);
      color: var(--accent);
      border: 1px solid rgba(61,154,106,0.4);
      display: block;
    }
    .toast.error {
      background: rgba(225,29,46,0.12);
      color: #f08080;
      border: 1px solid rgba(225,29,46,0.25);
      display: block;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">jinx3</a>
    <nav>
      <a href="/">Home</a>
      <a href="/music.html">Music</a>
      <a class="active" href="/admin.html">Admin</a>
    </nav>
  </header>
  <main class="admin-container">
    <span class="badge">Operator Panel</span>
    <h1>Customize Site Products</h1>
    <p class="section-intro">Add, edit, or remove products and services appearing on your live homepage.</p>

    <div id="toast" class="toast"></div>

    <div class="cta-row" style="margin-bottom: 2rem; display: flex; gap: 0.75rem;">
      <button class="btn primary" id="addBtn">+ Add Product/Service</button>
      <button class="btn ghost" id="saveBtn">💾 Save Live Changes</button>
    </div>

    <div id="products-list">
      <!-- loaded via javascript -->
    </div>
  </main>
  <footer>
    <span>© jinx3 / Guice Atkinson</span>
  </footer>

  <script>
    const listEl = document.getElementById("products-list");
    const toastEl = document.getElementById("toast");
    let services = [];

    function showToast(msg, isError = false) {
      toastEl.textContent = msg;
      toastEl.className = `toast ${isError ? 'error' : 'success'}`;
      toastEl.style.display = 'block';
      setTimeout(() => {
        toastEl.style.display = 'none';
      }, 4000);
    }

    async function loadProducts() {
      try {
        const res = await fetch("services.json", { cache: "no-store" });
        services = await res.json();
        renderProducts();
      } catch (err) {
        showToast("Error loading services: " + err.message, true);
      }
    }

    function renderProducts() {
      listEl.innerHTML = services.map((s, index) => `
        <div class="product-form-card" data-index="${index}">
          <h3>Product #${index + 1}</h3>
          <button class="btn-danger" onclick="deleteProduct(${index})">Delete</button>
          
          <div class="form-group" style="margin-top: 1rem;">
            <label>Product Unique ID</label>
            <input type="text" value="${s.id || ''}" onchange="updateField(${index}, 'id', this.value)" placeholder="e.g. magic_paper" />
          </div>
          
          <div class="form-group">
            <label>Title</label>
            <input type="text" value="${s.title || ''}" onchange="updateField(${index}, 'title', this.value)" placeholder="e.g. Magic Paper" />
          </div>
          
          <div class="form-group">
            <label>Price Display</label>
            <input type="text" value="${s.price || ''}" onchange="updateField(${index}, 'price', this.value)" placeholder="e.g. $1 / foot (5 ft min)" />
          </div>
          
          <div class="form-group">
            <label>Blurb (Description)</label>
            <textarea onchange="updateField(${index}, 'blurb', this.value)" placeholder="Short description of the product...">${s.blurb || ''}</textarea>
          </div>

          <div class="form-group">
            <label>Bullet Points (one per line)</label>
            <textarea onchange="updateBullets(${index}, this.value)" placeholder="Feature 1\nFeature 2...">${(s.bullets || []).join('\n')}</textarea>
          </div>
        </div>
      `).join("");
    }

    function updateField(index, field, value) {
      services[index][field] = value;
    }

    function updateBullets(index, value) {
      services[index].bullets = value.split('\n').map(b => b.trim()).filter(Boolean);
    }

    function deleteProduct(index) {
      if (confirm("Are you sure you want to delete this product?")) {
        services.splice(index, 1);
        renderProducts();
      }
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      services.push({
        id: "new_product_" + Date.now(),
        title: "New Product",
        blurb: "Product description goes here.",
        price: "$0.00",
        bullets: ["Feature 1", "Feature 2"]
      });
      renderProducts();
      listEl.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/save-services", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(services)
        });
        const data = await res.json();
        if (data.ok) {
          showToast("Live changes saved and published successfully!");
        } else {
          showToast("Error saving changes: " + data.error, true);
        }
      } catch (err) {
        showToast("Error saving changes: " + err.message, true);
      }
    });

    loadProducts();
  </script>
</body>
</html>
